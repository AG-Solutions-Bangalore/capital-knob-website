<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Trailing-slash normalizer (production): the prerendered build ships
      one folder per route (`/about-us/index.html`), so static hosts serve
      `/about-us/`. Canonicals are slash-free, so strip the slash with
      history.replaceState before first paint — keeps URL === canonical and
      avoids duplicate-indexing without triggering a network reload loop. -->
    <script>
      (function () {
        var p = location.pathname;
        if (p.length > 1 && p.charAt(p.length - 1) === '/') {
          try {
            history.replaceState(null, '', p.slice(0, -1) + location.search + location.hash);
          } catch (e) {}
        }
      })();
    </script>

    <!-- Fonts Preconnect & Optimized Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://capitalknob.com" crossorigin>
    <link rel="preconnect" href="http://capitalknob.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://capitalknob.com">
    <link rel="dns-prefetch" href="http://capitalknob.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    </noscript>

    <!-- LCP image preload — responsive local WebP (see public/images/home/).
      href = most-likely candidate: 360–480px phones at DPR2 pick the 768w
      variant; imagesrcset covers the rest (desktop 1350px → 1440w). -->
    <link rel="preload" as="image" type="image/webp" imagesrcset="/images/home/hero_villa-480.webp 480w, /images/home/hero_villa-768.webp 768w, /images/home/hero_villa-1280.webp 1280w, /images/home/hero_villa-1440.webp 1440w, /images/home/hero_villa-1920.webp 1920w" imagesizes="100vw" href="/images/home/hero_villa-768.webp" fetchpriority="high">


  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
