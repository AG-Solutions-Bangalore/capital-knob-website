<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Navy Theme Background (matches --color-navy #0b1d3a & --color-navy-deep #081530) -->
    <linearGradient id="themeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2246"/>
      <stop offset="45%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#061124"/>
    </linearGradient>

    <!-- Capital Royal Electric Blue (matches --color-brand-blue #1d4ed8) -->
    <linearGradient id="capitalBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Knob Signature Gold (matches --color-gold #c9a961 & --color-gold-hover #b8964f) -->
    <linearGradient id="knobGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5dc9e"/>
      <stop offset="25%" stop-color="#e2c076"/>
      <stop offset="65%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#b8964f"/>
    </linearGradient>

    <!-- Outer Gold Accent Border -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5dc9e" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#c9a961" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a8853b" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="elevatedShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Theme Rounded Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#themeBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#goldBorder)" stroke-width="3.5"/>

  <!-- Monogram Group (C = Capital Blue, K = Knob Gold) -->
  <g filter="url(#elevatedShadow)">
    <!-- Letter 'C' in Brand Blue -->
    <path d="M 290 156
             A 142 142 0 1 0 290 356
             L 251 317
             A 86 86 0 1 1 251 195
             Z"
          fill="url(#capitalBlue)"/>

    <!-- Letter 'K' in Signature Gold -->
    <!-- Vertical stem centered in the C opening -->
    <rect x="220" y="195" width="44" height="122" rx="8" fill="url(#knobGold)"/>

    <!-- Top Diagonal Arm of K (reaches to top baseline 156) -->
    <polygon points="260,250 358,156 414,156 298,272" fill="url(#knobGold)"/>

    <!-- Bottom Diagonal Arm of K (reaches to bottom baseline 356) -->
    <polygon points="260,262 298,240 414,356 358,356" fill="url(#knobGold)"/>
  </g>
</svg>